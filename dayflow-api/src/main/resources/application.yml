spring:
  application:
    name: dayflow-api
  profiles:
    default: local
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: logs/dayflow-api.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/dayflow-api.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n"

dayflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    admin:
      enabled: ${DAYFLOW_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${DAYFLOW_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${DAYFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${DAYFLOW_BOOTSTRAP_ADMIN_FIRST_NAME:}
      last-name: ${DAYFLOW_BOOTSTRAP_ADMIN_LAST_NAME:}
