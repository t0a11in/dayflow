services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: dayflow-oracle
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: DAYFLOW
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
